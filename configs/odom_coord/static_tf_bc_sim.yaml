# Camera extrinsics of the SIMULATOR, not the vehicle.
log_level: Info
publish_interval_ms: 1000

static_broudcaster_conf:
  transforms:
    - parent_frame_id: map
      child_frame_id: odom
      translation:
        x: 0.0
        y: 0.0
        z: 0.0
      rpy_angle:
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
    # NOTE: odom到gimbal的变换由serial发布
    - parent_frame_id: gimbal
      child_frame_id: camera
      translation:
        # Camera offset from the gimbal centre (yaw/pitch axis intersection),
        # derived from RmRobot.proto's joint chain: 0.1008 m forward along
        # the boresight, 0.0563 m above it, centred laterally.
        #
        # CONVENTION: Transform::getIsometry3d() applies rotation-then-
        # translate (T x = R x + R t), so this translation is expressed in
        # the CHILD (camera optical, x right / y down / z forward) frame:
        # forward -> +z, up -> -y.  The vehicle's own yaml follows the same
        # convention -- writing the offset in parent-frame axes here is what
        # rotated the camera lever arm by 90 deg and sank every
        # reconstruction ~6 cm.
        x: 0.0
        y: -0.067676
        z: 0.093543
      rpy_angle:
        # roll = -90 - 6.7: the camera's boresight sits 6.7 deg BELOW the
        # pitch joint's zero line (a mounting slant, calibrated from the
        # vertical miss distribution against the plate-height ground truth;
        # an earlier 5.4 was calibrated against a plate height that was
        # 5.5 cm short and left shots grouping 4 cm high).  In the ZYX
        # convention the whole correction lands in the roll slot; the
        # translation is re-expressed accordingly (child-frame convention).
        roll: -96.7
        pitch: 0.0
        yaw: -90.0
